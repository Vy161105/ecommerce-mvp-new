services:
  kafka-topic-init:
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic ${KAFKA_ORDER_TOPIC:-order-created} \
          --partitions 1 \
          --replication-factor 1

  product-rs-init:
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mongosh --host product-db --quiet --eval '
          try {
            rs.status()
          } catch(e) {
            if(e.codeName !== "NotYetInitialized") throw e;
            rs.initiate({
              _id: "rs-product",
              members: [{_id: 0, host: "product-db:27017"}]
            })
          }
        '
        for i in $$(seq 1 60); do
          if mongosh --host product-db --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
            exit 0
          fi
          sleep 2
        done
        exit 1
